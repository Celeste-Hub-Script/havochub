<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Tabbed App with Permissions</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #121212;
    color: #eee;
  }

  #loginPage {
    height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #1f1f1f, #0d0d0d);
  }

  .login-box {
    width: 100%;
    max-width: 360px;
    background: #1e1e1e;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    text-align: center;
  }

  .login-box h2 { color: #4caf50; }
  .login-box input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    background: #2a2a2a;
    color: #fff;
  }
  .login-box button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    background: #4caf50;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
  }

  #app { display: none; height: 100vh; }

  .sidebar {
    width: 220px;
    background: #1a1a1a;
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    padding-top: 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .tab { padding: 18px; cursor: pointer; }
  .tab:hover { background: #2a2a2a; }
  .tab.active { background: #2a2a2a; border-left: 4px solid #4caf50; }
  .logout { padding: 18px; color: red; cursor: pointer; }

  .content {
    margin-left: 220px;
    padding: 40px;
    background: #141414;
    height: 100vh;
    overflow-y: auto;
  }

  .panel { display: none; }
  .panel.active { display: block; }
  h1 { color: #4caf50; }

  table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    background: #1e1e1e;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    text-align: center;
    padding: 12px;
    border-top: 1px solid #2d2d2d;
  }

  th { background: #252525; color: #4caf50; }
  button.small {
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .delete-btn { background: #ff4d4d; color: white; }
  .delete-btn:hover { background: #ff2d2d; }

  .add-btn {
    background: #4caf50;
    border: none;
    padding: 10px 14px;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 10px;
  }

  .checkbox-row {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        margin: 8px 0;
    }

    .checkbox-row input[type="checkbox"] {
        width: auto;
        margin: 0;
    }

    .checkbox-row label {
        margin: 0;
        cursor: pointer;
    }

  /* MODALS */
  #scriptModal, #whitelistModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
  }

  #scriptModalBox, #whitelistModalBox {
    background: #1e1e1e;
    width: 500px;
    margin: 10vh auto;
    padding: 20px;
    border-radius: 12px;
  }

  input, textarea, select {
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    background: #2a2a2a;
    border: none;
    color: white;
    border-radius: 6px;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <div>
      <div class="tab active" onclick="showTab('home', this)">Dashboard</div>
      <div class="tab" onclick="showTab('scripts', this)">Scripts</div>
      <div class="tab" onclick="showTab('whitelist', this)">Whitelist</div>
    </div>
    <div class="logout" onclick="logout()">Logout</div>
  </div>

  <div class="content">

    <div id="home" class="panel active">
      <h1>Dashboard</h1>
    </div>

    <!-- SCRIPTS -->
    <div id="scripts" class="panel">
      <h1>Scripts</h1>
      <button class="add-btn" onclick="openScriptModal()">+ Add Script</button>
      <button class="add-btn" onclick="copyLoadstring()">Copy Loadstring</button>
      <table>
        <thead>
          <tr>
            <th>Game ID</th>
            <th>Type</th>
            <th>Content</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="scriptsTable"></tbody>
      </table>
    </div>

    <!-- WHITELIST -->
    <div id="whitelist" class="panel">
      <h1>Whitelist</h1>
      <button class="add-btn" onclick="openWhitelistModal()">+ Add / Edit User</button>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Perm</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="whitelistTable"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- SCRIPT MODAL -->
<div id="scriptModal">
  <div id="scriptModalBox">
    <h2>Add Script</h2>
    <input id="gameId" placeholder="Game ID">
    <select id="scriptType" onchange="toggleInput()">
      <option value="paste">Paste</option>
      <option value="link">Link</option>
    </select>
    <textarea id="scriptPaste"></textarea>
    <input id="scriptLink" style="display:none;">
    <button onclick="saveScript()">Save</button>
    <button onclick="closeScriptModal()">Close</button>
  </div>
</div>

<!-- WHITELIST MODAL -->
<div id="whitelistModal">
  <div id="whitelistModalBox">
    <h2>Add / Edit User</h2>
    <input id="newName" placeholder="Name">
    <input id="newEmail" placeholder="Email">
    <input id="newPassword" placeholder="Password">
    <div class="checkbox-row">
        <input type="checkbox" id="canWhitelist">
        <label for="canWhitelist">Can Whitelist</label>
    </div>
    <button onclick="addOrUpdateUser()">Save</button>
    <button onclick="closeWhitelistModal()">Close</button>
  </div>
</div>

<script>
const LOCKED_EMAIL = "jtgariglio@gmail.com";

let users = JSON.parse(localStorage.getItem("users")) || [
  { name:"Owner", email:LOCKED_EMAIL, password:"owner", permissions:{canWhitelist:true} }
];

let scripts = JSON.parse(localStorage.getItem("scripts")) || [];
const GITHUB_BASE = "https://YOUR-USERNAME.github.io/YOUR-REPO";
const LOADER_URL = `${GITHUB_BASE}/loader.lua`;
let currentUser = null;

/* LOGIN */
function login(){
  const u = users.find(x=>x.email===email.value && x.password===password.value);
  if(!u) return alert("Invalid login");
  currentUser = u;
  loginPage.style.display="none";
  app.style.display="block";
  renderWhitelist();
  renderScripts();
}

/* TAB */
function showTab(id, el){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  el.classList.add("active");
}
function logout(){ location.reload(); }

/* WHITELIST MODAL */
function openWhitelistModal(){ whitelistModal.style.display="block"; }
function closeWhitelistModal(){ whitelistModal.style.display="none"; }

function addOrUpdateUser(){
  const emailVal = newEmail.value;
  if(emailVal === LOCKED_EMAIL) return alert("This account is locked.");

  const i = users.findIndex(u=>u.email===emailVal);
  if(i>=0){
    users[i] = {
      name:newName.value,
      email:emailVal,
      password:newPassword.value,
      permissions:{canWhitelist:canWhitelist.checked}
    };
  } else {
    users.push({
      name:newName.value,
      email:emailVal,
      password:newPassword.value,
      permissions:{canWhitelist:canWhitelist.checked}
    });
  }
  save();
  renderWhitelist();
  closeWhitelistModal();
}

function renderWhitelist(){
  const t = whitelistTable;
  t.innerHTML="";
  users.forEach((u,i)=>{
    const locked = u.email === LOCKED_EMAIL;
    t.innerHTML += `
      <tr>
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td>${u.permissions.canWhitelist}</td>
        <td>
          ${locked ? "LOCKED" : `
            <button onclick="deleteUser(${i})" class="small delete-btn">Delete</button>
            <button onclick="editUser(${i})" class="small add-btn">Edit</button>
          `}
        </td>
      </tr>
    `;
  });
}

function editUser(i){
  const u = users[i];
  newName.value = u.name;
  newEmail.value = u.email;
  newPassword.value = u.password;
  canWhitelist.checked = u.permissions.canWhitelist;
  openWhitelistModal();
}

function deleteUser(i){
  if(users[i].email === LOCKED_EMAIL) return;
  users.splice(i,1);
  save();
  renderWhitelist();
}

/* SCRIPTS MODAL */
function openScriptModal(){ scriptModal.style.display="block"; }
function closeScriptModal(){ scriptModal.style.display="none"; }

function saveScript(){
  const id = gameId.value;
  if(!/^\d+$/.test(id)) return alert("Numbers only");
  scripts.push({
    gameId:id,
    type:scriptType.value,
    content:scriptType.value==="paste" ? scriptPaste.value : scriptLink.value
  });
  save();
  renderScripts();
  closeScriptModal();
}

function getLoaderScript(){
  return {
    gameId: "LOADER",
    type: "loader",
    content: `loadstring(game:HttpGet("${LOADER_URL}"))()`
  };
}

function renderScripts(){
  const t = scriptsTable;
  t.innerHTML="";
  const all = [getLoaderScript(), ...scripts];
  all.forEach((s,i)=>{
    const locked = s.type === "loader";
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${s.gameId}</td>
      <td>${s.type}</td>
      <td>${s.content.slice(0,40)}</td>
      <td>
        ${locked ? "PROTECTED" : `<button class="small delete-btn">Delete</button>`}
      </td>
    `;
    if(!locked){
      row.querySelector("button").onclick = ()=>{
        scripts.splice(i-1,1);
        save();
        renderScripts();
      };
    }
    t.appendChild(row);
  });
}

/* COPY LOADSTRING */
function copyLoadstring(){
  navigator.clipboard.writeText(`loadstring(game:HttpGet("${LOADER_URL}"))()`);
  alert("Copied");
}

/* SAVE */
function save(){
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("scripts", JSON.stringify(scripts));
}

/* MODAL TOGGLE INPUT */
function toggleInput(){
  scriptPaste.style.display = scriptType.value==="paste"?"block":"none";
  scriptLink.style.display = scriptType.value==="link"?"block":"none";
}
</script>
</body>
</html>
